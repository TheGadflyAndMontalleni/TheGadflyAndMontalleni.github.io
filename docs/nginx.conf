# RIME_SUN 笔记站 —— nginx 配置示例
#
# 用法：
#   1. 先把 dist/ 里的内容上传到服务器的 /var/www/rimesun-blog/（见 docs/DEPLOY.md）
#   2. 把本文件复制到服务器：/etc/nginx/conf.d/rimesun.conf
#   3. 把下面的 server_name 改成你自己的域名
#   4. 校验并重载：nginx -t && systemctl reload nginx
#
# 注意：站点是纯静态文件，nginx 只负责发文件，没有后端进程、不需要 Node 常驻。

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;          # TODO: 改成你的域名（没域名就先填服务器 IP）

    # 证书配好之后，把上面改成只留 443，并用下面这行把 HTTP 全部跳转到 HTTPS
    # return 301 https://$host$request_uri;

    root /var/www/rimesun-blog;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/rimesun.access.log;
    error_log  /var/log/nginx/rimesun.error.log;

    # ── 路由 ──────────────────────────────────────────────
    # Astro 输出的是目录式路由（/posts/xxx/index.html），按这个顺序找文件
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro 会生成 404.html，交给它处理
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 被关闭的页面（siteConfig.ts 里的 pages 设为 false）在构建产物里是一个
    # 跳转桩页（meta refresh 到 /404/），访客会先看到闪一下的跳转页。
    # 这里直接返回 404，一步到位。以后启用了某个页面，记得把对应路径从这里删掉。
    location ~ ^/(friends|guestbook|dynamic|projects|gallery|booknav|bilibili|bangumi|vndb|myanimelist|sponsor)/ {
        return 404;
    }

    # ── 缓存策略 ──────────────────────────────────────────
    # 构建产物文件名带内容哈希，内容一变文件名就变，可以放心长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 搜索索引文件名固定，改了内容必须让浏览器重新拉
    location /pagefind/ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        access_log off;
    }

    # HTML 不缓存，否则更新后访问者还会看到旧页面
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 图片、字体、音视频等静态资源
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico|mp3|wav|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── 压缩 ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 服务器装了 brotli 模块的话，这几行能再省 15% 左右流量，没有就删掉
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 基础安全响应头 ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 站点不需要被搜索引擎收录的目录（比如 pio 看板娘素材），可以顺手屏蔽
    # location /pio/ {
    #     return 404;
    # }
}

# ── HTTPS 版本 ────────────────────────────────────────────
# 用 certbot 申请免费证书后（见 docs/DEPLOY.md 第 4 步），certbot 会自动生成一份
# 配置。如果你想手写，参考下面这个骨架，把 root / location / gzip 段落与上面保持一致。
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name blog.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     root /var/www/rimesun-blog;
#     index index.html;
#     # ... 与上面 HTTP server 相同的 location、gzip、安全头配置 ...
# }
